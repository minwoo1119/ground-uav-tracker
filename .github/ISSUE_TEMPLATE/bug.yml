name: 버그 보고
description: 재현 가능한 오동작 또는 회귀를 보고합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        비밀 정보, 개인 경로, 외부 데이터 원본 및 대용량 로그를 첨부하지 마세요.
        가능한 경우 최소 재현 절차와 실제 종료 코드까지 기록해 주세요.

  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 발생한 문제와 영향을 간결하게 설명해 주세요.
      placeholder: 무엇이 언제부터 잘못 동작하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 깨끗한 환경에서 따라 할 수 있도록 명령과 입력 조건을 순서대로 작성해 주세요.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: 기대 결과와 실제 결과
      placeholder: |
        기대 결과:
        실제 결과:
        종료 코드:
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS/아키텍처, 컴파일러, CMake, 하드웨어와 관련 설정을 작성해 주세요.
      placeholder: |
        OS/아키텍처:
        컴파일러:
        CMake:
        하드웨어:
        코드 리비전:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 관련 로그
      description: 민감 정보를 제거한 최소 로그를 붙여 주세요.
      render: shell

  - type: textarea
    id: verification
    attributes:
      label: 수정 후 검증 방법
      description: 회귀 테스트와 수동 검증 명령, 기대 결과를 작성해 주세요.
      placeholder: |
        - 추가할 자동 테스트:
        - 실행할 명령:
        - 기대 결과:
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 Issue 및 PR에서 동일한 문제가 보고되지 않았는지 확인했습니다.
          required: true
        - label: 로그에서 비밀 정보와 개인 경로를 제거했습니다.
          required: true
